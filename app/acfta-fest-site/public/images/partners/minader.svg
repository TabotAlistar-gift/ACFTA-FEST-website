<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 80" fill="none">
  <!-- MINADER Cameroon Official Agricultural Seal -->
  <g transform="translate(8, 10)">
    <circle cx="30" cy="30" r="27" fill="#ffffff" stroke="#166839" stroke-width="3"/>
    <!-- Wreath & Crop Ears -->
    <path d="M16 42 C12 31 15 19 25 14" stroke="#166839" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M44 42 C48 31 45 19 35 14" stroke="#166839" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Rising Sun & Furrows -->
    <circle cx="30" cy="27" r="8" fill="#F2C529"/>
    <polygon points="30,18 31.8,23.2 37.2,23.2 32.8,26.4 34.4,31.6 30,28.5 25.6,31.6 27.2,26.4 22.8,23.2 28.2,23.2" fill="#C82829"/>
    <path d="M17 41 Q30 35 43 41" stroke="#166839" stroke-width="2.5" fill="none"/>
    <path d="M20 46 Q30 41 40 46" stroke="#C82829" stroke-width="2" fill="none"/>
  </g>
  <!-- Wordmark -->
  <text x="76" y="39" font-family="'DM Sans', 'Arial Black', sans-serif" font-size="27" font-weight="900" letter-spacing="1.4" fill="#166839">MINADER</text>
  <text x="77" y="55" font-family="'DM Sans', Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="1.4" fill="#526459">AGRICULTURE &amp; RURAL DEVELOPMENT</text>
</svg>
