<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 80" fill="none">
  <!-- Crown + Renewable Energy Grid Emblem -->
  <g transform="translate(8, 10)">
    <polygon points="30,3 55,17 55,45 30,59 5,45 5,17" fill="#0B3B2D" stroke="#D9A436" stroke-width="2.5"/>
    <!-- Crown Peaks -->
    <path d="M15 36 L19 20 L30 29 L41 20 L45 36 Z" fill="#E6B949"/>
    <!-- Grid Lines -->
    <line x1="15" y1="41" x2="45" y2="41" stroke="#64C587" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="46" x2="40" y2="46" stroke="#64C587" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="76" y="38" font-family="'DM Sans', Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="1" fill="#0B3B2D">CROWNGRID</text>
  <text x="77" y="56" font-family="'DM Sans', Arial, sans-serif" font-size="11.5" font-weight="800" letter-spacing="3.5" fill="#B88628">ENGINEERING</text>
</svg>
