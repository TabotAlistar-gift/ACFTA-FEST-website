<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none">
  <!-- Energy Commission of Nigeria (ECN) Official Crest: Green/White Shield, Sun & Atomic Orbitals -->
  <g transform="translate(8, 10)">
    <circle cx="30" cy="30" r="28" fill="#007A3D" stroke="#D4AF37" stroke-width="2.2"/>
    <circle cx="30" cy="30" r="21" fill="#ffffff"/>
    <!-- Atomic Energy Orbitals -->
    <ellipse cx="30" cy="30" rx="16" ry="7" transform="rotate(-30 30 30)" stroke="#007A3D" stroke-width="1.8" fill="none"/>
    <ellipse cx="30" cy="30" rx="16" ry="7" transform="rotate(30 30 30)" stroke="#005691" stroke-width="1.8" fill="none"/>
    <!-- Solar Core & Lightning Bolt -->
    <circle cx="30" cy="30" r="6.5" fill="#F39C12"/>
    <polygon points="31,22 26,30 30,30 29,38 34,30 30,30" fill="#ffffff"/>
  </g>
  <!-- Wordmark -->
  <text x="76" y="34" font-family="'DM Sans', Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="0.8" fill="#006837">ENERGY COMMISSION</text>
  <text x="76" y="53" font-family="'DM Sans', Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="1.8" fill="#123D2D">OF NIGERIA <tspan fill="#D4AF37" font-size="12">(ECN)</tspan></text>
</svg>
