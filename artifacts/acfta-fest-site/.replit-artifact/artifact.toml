kind = "web"
previewPath = "/"
title = "ACFTA Fest"
description = "A premium, responsive single-page website for ACFTA Fest, connecting African trade, entrepreneurship, culture, and sport while clearly flagging edition details awaiting confirmation."
version = "1.0.0"
id = "artifacts/acfta-fest-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23638

[services.development]
run = "pnpm --filter @workspace/acfta-fest-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/acfta-fest-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/acfta-fest-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23638"
BASE_PATH = "/"
